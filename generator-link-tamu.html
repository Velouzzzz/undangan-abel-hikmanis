<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Generator Link Tamu</title><style>body{font:15px/1.6 Arial,sans-serif;background:#fbf8f4;color:#554747;max-width:760px;margin:35px auto;padding:0 18px}h1{font:32px Georgia;color:#9c6b6b}textarea,input{width:100%;padding:12px;border:1px solid #d8bdb6;background:white;box-sizing:border-box;margin:7px 0 14px}button{padding:11px 17px;background:#9c6b6b;color:white;border:0;cursor:pointer;margin:5px 5px 5px 0}.item{border-bottom:1px solid #eadbd6;padding:12px 0;overflow-wrap:anywhere}.item a{color:#9c6b6b}.hint{color:#887674;font-size:13px}</style></head><body><h1>Generator Link Tamu</h1><p>Tempel satu nama per baris. Masukkan URL undangan yang sudah dipublikasikan.</p><label>URL undangan<input id="base" value="https://example.com/" type="url"></label><label>Daftar nama tamu<textarea id="names" rows="8" placeholder="Bapak Ahmad&#10;Ibu Siti&#10;Keluarga Budi"></textarea></label><button id="make">Buat link personal</button><button id="copyAll">Salin semua pesan</button><div id="results"></div><script>let generated=[];const $=id=>document.getElementById(id);$('make').onclick=()=>{const base=$('base').value.trim();generated=$('names').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean).map(name=>{const u=new URL(base);u.searchParams.set('to',name);const msg=`Assalamu’alaikum, ${name}. Dengan hormat kami mengundang Anda untuk hadir di hari bahagia kami. Buka undangan: ${u.href}`;return{name,url:u.href,msg}});$('results').innerHTML=generated.map((x,i)=>`<div class="item"><b>${i+1}. ${esc(x.name)}</b><br><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a><br><button data-copy="${i}">Salin link</button><button data-msg="${i}">Salin pesan WhatsApp</button></div>`).join('')};function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function cp(t){try{await navigator.clipboard.writeText(t)}catch(e){prompt('Salin teks ini:',t)}}$('results').onclick=e=>{if(e.target.dataset.copy!==undefined)cp(generated[+e.target.dataset.copy].url);if(e.target.dataset.msg!==undefined)cp(generated[+e.target.dataset.msg].msg)};$('copyAll').onclick=()=>cp(generated.map(x=>x.msg).join('\n\n'));</script></body></html>
